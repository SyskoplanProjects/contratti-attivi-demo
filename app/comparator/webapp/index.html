<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Contract Comparator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
  <script>
    window.__authPromise = fetch('/comparator/', {
      headers: { 'Authorization': 'Basic ' + btoa('mario.rossi@contrattiattivi.it:test') }
    }).catch(function () {});
  </script>
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
     data-sap-ui-resourceroots='{"com.reply.contrattiattivi.comparator": "/comparator/webapp/", "com.reply.contrattiattivi": "/comparator/webapp/"}'
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="trusted"
    data-sap-ui-preload="async">
  </script>
  <script>
    sap.ui.getCore().attachInit(function () {
      window.__authPromise.then(function () {
        new sap.ui.core.ComponentContainer({
          name: "com.reply.contrattiattivi.comparator",
          settings: { id: "comparatorApp" },
          async: true
        }).placeAt("content");
      });
    });
  </script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
